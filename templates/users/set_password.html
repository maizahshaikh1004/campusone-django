<h1>Set Password</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
    >

    <button type="submit">
        Set Password
    </button>

</form>
