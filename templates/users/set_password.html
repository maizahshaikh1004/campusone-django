{% extends 'base.html' %}

{% block title %}Set Password - CampusOne{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: calc(100vh - 120px);">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Set Password</h1>
            <p>Setup a password to activate your account</p>
        </div>

        {% if error %}
            <div class="message-toast error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Set Password & Activate
            </button>
        </form>
    </div>
</div>
{% endblock %}
