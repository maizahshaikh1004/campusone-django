{% extends 'base.html' %}

{% block title %}Edit Profile - CampusOne{% endblock %}

{% block content %}
    <!-- Page Header -->
    <div class="page-header">
        <h1>
            <span><span class="material-symbols-outlined">edit</span></span>
            <span>Edit Profile</span>
        </h1>
        <a href="{% url 'profile' %}" class="back-link">← Back to Profile</a>
    </div>

    <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
        
        <!-- Profile Photo Preview -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            {% if profile and profile.profile_photo %}
                <img src="/media/{{ profile.profile_photo.url }}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent);" alt="Avatar">
            {% else %}
                <div style="width: 100px; height: 100px; border-radius: 50%; background-color: var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; color: var(--text-secondary);">
                    {{ profile.full_name|slice:":1"|upper }}
                </div>
            {% endif %}
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="profile_photo">Profile Photo</label>
                <input type="file" id="profile_photo" name="profile_photo" accept="image/*">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       value="{{ profile.phone }}"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       minlength="10"
                       inputmode="numeric"
                       placeholder="Enter 10 digit phone number"
                       required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter physical address">{{ profile.address|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Write a short bio...">{{ profile.bio|default:'' }}</textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;"><span class="material-symbols-outlined">save</span> Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            </div>
        </form>

    </div>
{% endblock %}
