<!-- Navbar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'faculty_notices' %}" class="back-link">
            <span>←</span>
            <span>Back to Notices</span>
        </a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
</nav>

<!-- Main -->
<main class="container">
    <div class="page-header">
        <h1>
            <span>✏️</span>
            <span>Edit Notice</span>
        </h1>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="message-toast {{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="notice-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ notice.title }}" required>
        </div>

        <div class="form-group">
            <label for="content">Content *</label>
            <textarea id="content" name="content" required>{{ notice.content }}</textarea>
        </div>

        <div class="form-group">
            <label>Current Attachment</label>
            {% if notice.attachment %}
                <div class="attachment-info">
                    <a href="{{ notice.attachment.url }}" target="_blank">📎 {{ notice.attachment.name }}</a>
                    <label>
                        <input type="checkbox" name="remove_attachment" value="1">
                        <span>Remove attachment</span>
                    </label>
                </div>
            {% else %}
                <p>No attachment</p>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="attachmentInput">New Attachment (optional)</label>
            <input type="file" name="attachment" id="attachmentInput">
        </div>

        <div class="form-footer">
            <a href="{% url 'faculty_notices' %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Save Changes</button>
        </div>
    </form>
</main>
