<!-- Navbar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'event_detail' event.id %}" class="back-link">
            <span>←</span>
            <span>Back to Event Details</span>
        </a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
</nav>

<!-- Main -->
<main class="container">
    <div class="page-header">
        <h1>
            <span>✏️</span>
            <span>Edit Event</span>
        </h1>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="message-toast {{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="event-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Event Title *</label>
            <input type="text" id="title" name="title" value="{{ event.title }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ event.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="event_date">Event Date *</label>
                <input type="date" id="event_date" name="event_date" value="{{ event.event_date|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label for="start_time">Start Time *</label>
                <input type="time" id="start_time" name="start_time" value="{{ event.start_time|time:'H:i' }}" required>
            </div>
            <div class="form-group">
                <label for="end_time">End Time *</label>
                <input type="time" id="end_time" name="end_time" value="{{ event.end_time|time:'H:i' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="venue">Venue *</label>
            <input type="text" id="venue" name="venue" value="{{ event.venue }}" required>
        </div>

        <div class="form-group">
            <label for="google_form_link">Google Form Link (Registration/Feedback)</label>
            <input type="url" id="google_form_link" name="google_form_link" value="{{ event.google_form_link }}">
        </div>

        <div class="form-group">
            <label>Current Poster</label>
            {% if event.poster %}
                <div class="poster-info">
                    <a href="{{ event.poster.url }}" target="_blank">🖼️ View Current Poster</a>
                </div>
            {% else %}
                <p>No poster uploaded</p>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="posterInput">Upload New Poster (optional)</label>
            <input type="file" name="poster" id="posterInput">
        </div>

        <div class="form-footer">
            <a href="{% url 'event_detail' event.id %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Save Changes</button>
        </div>
    </form>
</main>
