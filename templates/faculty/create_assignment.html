{% extends 'base.html' %}

{% block title %}Create Assignment - Faculty - CampusOne{% endblock %}

{% block back_link %}
<a href="{% url 'faculty_assignments' %}" class="back-link">
    <span>←</span>
    <span>Back to Assignments</span>
</a>
{% endblock %}

{% block content %}
    <div class="auth-wrapper" style="min-height: auto; padding: 2rem 0;">
        <div class="auth-card" style="max-width: 640px;">
            <div class="auth-header">
                <h1><span class="material-symbols-outlined">description</span> Create Assignment</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">Fill in the details to publish a new assignment.</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="faculty_subject">Subject & Class *</label>
                    <select name="faculty_subject" id="faculty_subject" required class="select-field">
                        <option value="">— Select Subject —</option>
                        {% for fs in faculty_subjects %}
                            <option value="{{ fs.id }}">
                                {{ fs.subject.name }} — {{ fs.subject.academic_class }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Midterm Project Proposal">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5" placeholder="Enter instructions or guidelines for the assignment..."></textarea>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date *</label>
                    <input type="date" id="due_date" name="due_date" required min="{{ today|date:'Y-m-d' }}">
                </div>

                <div class="form-group">
                    <label for="question_file">Question Paper (Attachment)</label>
                    <input type="file" id="question_file" name="question_file" class="input-field" style="padding: 0.5rem 0.75rem;">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <a href="{% url 'faculty_assignments' %}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Assignment</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
