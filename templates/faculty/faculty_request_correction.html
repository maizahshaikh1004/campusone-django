<!-- Navbar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'faculty_dashboard' %}" class="back-link">
            <span>←</span>
            <span>Back to Dashboard</span>
        </a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
</nav>

<!-- Main -->
<main class="container">
    <div class="page-header">
        <h1>
            <span>📝</span>
            <span>Request Attendance Correction</span>
        </h1>
        <p>Submit a request to correct a student's attendance record</p>
    </div>

    {% if message %}
        <div class="message-toast success">
            {{ message }}
        </div>
    {% endif %}

    {% if error %}
        <div class="message-toast error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" class="correction-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="attendance_id">Select Attendance Record *</label>
            <select name="attendance_id" id="attendance_id" required>
                <option value="">— Select Record —</option>
                {% for r in attendance_records %}
                    <option value="{{ r.id }}">
                        {{ r.student.full_name }} — {{ r.attendance_session.timetable.faculty_subject.subject.name }} ({{ r.attendance_session.lecture_date|date:"d M Y" }}) [Currently: {{ r.is_present|yesno:"Present,Absent" }}]
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="new_status">Requested Correct Status *</label>
            <select name="new_status" id="new_status" required>
                <option value="1">Present</option>
                <option value="0">Absent</option>
            </select>
        </div>

        <div class="form-group">
            <label for="reason">Reason for Correction *</label>
            <textarea name="reason" id="reason" placeholder="Explain why the correction is needed (e.g. proxy detected, system error)..." required></textarea>
        </div>

        <div class="form-footer">
            <a href="{% url 'faculty_dashboard' %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Submit Request</button>
        </div>
    </form>
</main>
